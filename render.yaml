services:
  - type: web
    name: quicknote
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /login
    envVars:
      - key: APP_NAME
        value: QuickNote
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://quicknoteapp.site
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: quicknote-db
          property: connectionString
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: public
      - key: MAIL_TIMEOUT
        value: 10
      - key: OCR_TESSERACT_PATH
        value: tesseract
      - key: OCR_GHOSTSCRIPT_PATH
        value: gs
      - key: OCR_LANGUAGE
        value: eng
      - key: OCR_PDF_DPI
        value: 150
      - key: OCR_TIMEOUT
        value: 45
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_TIMEOUT
        value: 20
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://quicknoteapp.site/auth/google/callback

databases:
  - name: quicknote-db
    plan: free
    databaseName: quicknote
    user: quicknote
