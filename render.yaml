services:
  - type: web
    name: quicknote
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /login
    envVars:
      - key: APP_NAME
        value: QuickNote
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: quicknote-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: public
      - key: MAIL_MAILER
        value: log
      - key: OCR_TESSERACT_PATH
        value: tesseract
      - key: OCR_GHOSTSCRIPT_PATH
        value: gs
      - key: OCR_LANGUAGE
        value: eng
      - key: OCR_PDF_DPI
        value: 300
      - key: OCR_TIMEOUT
        value: 120
      - key: AUTOCORRECT_DRIVER
        value: languagetool
      - key: AUTOCORRECT_LANGUAGE
        value: en-US
      - key: AUTOCORRECT_FALLBACK_TO_LOCAL
        value: true
      - key: LANGUAGETOOL_BASE_URL
        value: https://api.languagetool.org/v2
      - key: LANGUAGETOOL_TIMEOUT
        value: 10

databases:
  - name: quicknote-db
    plan: free
    databaseName: quicknote
    user: quicknote
